<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-label="Ignition">
  <title>Ignition</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a14"/>
      <stop offset="1" stop-color="#10120e"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c27a"/>
      <stop offset="1" stop-color="#e0923f"/>
    </linearGradient>
    <radialGradient id="ember" cx="18%" cy="42%" r="42%">
      <stop offset="0" stop-color="#e0923f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e0923f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        #ember-glow { animation: ember 3.4s ease-in-out infinite; }
      }
      @keyframes ember {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="920" height="260" rx="22" fill="url(#panel)"/>
  <rect width="918" height="258" x="1" y="1" rx="21" fill="none" stroke="#3e4136" stroke-width="1"/>
  <rect width="920" height="260" rx="22" fill="url(#ember)"/>

  <!-- industrial hatch -->
  <g stroke="#f6c27a" stroke-opacity=".05" stroke-width="1">
    <path d="M0 40 H920 M0 80 H920 M0 120 H920 M0 160 H920 M0 200 H920"/>
  </g>
  <g fill="#f6c27a" fill-opacity=".12">
    <circle cx="48" cy="48" r="2"/>
    <circle cx="48" cy="212" r="2"/>
    <circle cx="872" cy="48" r="2"/>
    <circle cx="872" cy="212" r="2"/>
  </g>

  <!-- flame mark -->
  <g transform="translate(56,54)">
    <ellipse id="ember-glow" cx="28" cy="88" rx="46" ry="58" fill="#e0923f" opacity=".35" filter="url(#soft)"/>
    <path fill="url(#copper)" d="M28 8 L52 32 L52 148 L4 148 L4 32 Z"/>
    <path fill="#1a140c" fill-opacity=".18" d="M28 28 L44 42 L44 148 L28 148 Z"/>
    <rect x="20" y="58" width="16" height="4" fill="#1a140c" fill-opacity=".28"/>
    <rect x="20" y="78" width="16" height="4" fill="#1a140c" fill-opacity=".28"/>
    <rect x="20" y="98" width="16" height="4" fill="#1a140c" fill-opacity=".28"/>
  </g>

  <g fill="#9d9888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="140" y="92" font-size="13" letter-spacing="6.4">STARTUP PICKER</text>
  </g>
  <text x="140" y="156" fill="#f4f0e4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.2">Ignition</text>
  <text x="144" y="196" fill="#a39e8c" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16">Opens the list at login. Then it quits.</text>
  <rect x="140" y="214" width="72" height="3" fill="url(#copper)"/>
</svg>
