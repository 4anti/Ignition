[package]
name = "ignition"
version = "0.1.0"
description = "Pick programs, files, and URLs to open at login."
authors = ["4anti"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ignition_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
